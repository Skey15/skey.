<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #fecfef 50%, #a8edea 75%, #fed6e3 100%);
        background-size: 400% 400%;
        animation: gradientShift 20s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        color: #333;
        overflow: hidden;
        position: relative;
    }

    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
        animation: float 10s linear infinite;
        pointer-events: none;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-100px); }
    }

    .envelope {
        width: 350px;
        height: 240px;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        border-radius: 15px;
        position: relative;
        cursor: pointer;
        box-shadow: 0 25px 70px rgba(0,0,0,0.3), 0 0 50px rgba(255, 154, 158, 0.4);
        transform-origin: center;
        transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 1.2s ease;
        border: 3px solid rgba(255, 255, 255, 0.3);
        overflow: hidden;
    }

    .envelope::before {
        content: '';
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 2px;
    }

    .envelope.open {
        pointer-events: none;
        transform: scale(0.9) rotateY(180deg);
        opacity: 0;
    }

    .flap {
        position: absolute;
        top: -1px;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #fecfef 0%, #ff9a9e 100%);
        clip-path: polygon(0 0, 100% 0, 50% 65%);
        transform-origin: top;
        transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        box-shadow: 0 10px 30px rgba(255, 154, 158, 0.4);
    }

    .envelope.open .flap {
        transform: rotateX(-180deg);
    }

    .card {
        text-align: center;
        max-width: min(450px, 88vw);
        box-sizing: border-box;
        display: none;
        background: rgba(255, 255, 255, 0.98);
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.2), 0 0 60px rgba(255, 154, 158, 0.3);
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 255, 255, 0.6);
        transform: scale(0.8) rotateY(90deg);
        opacity: 0;
        transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .card.show {
        display: block;
        transform: scale(1) rotateY(0deg);
        opacity: 1;
    }

    img {
        width: 100%;
        max-height: 55vh;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
        filter: brightness(1.1);
    }

    img.hide {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
        filter: brightness(0.9);
    }

    .text {
        margin-top: 25px;
        font-size: 1.4rem;
        min-height: 80px;
        transition: opacity 0.8s ease, transform 0.8s ease;
        color: #555;
        font-weight: 500;
        line-height: 1.7;
        font-family: 'Dancing Script', cursive;
    }

    .hint {
        margin-top: 20px;
        font-size: 1rem;
        opacity: 0.8;
        color: #ff9a9e;
        font-weight: 600;
        transition: opacity 0.5s ease;
    }

    .hint:hover {
        opacity: 1;
    }

    .buttons {
        display: none;
        margin-top: -20px;
        justify-content: center;
        gap: 20px;
    }

    .buttons.show {
        display: flex;
    }

    .button {
        padding: 15px 30px;
        font-size: 1.2rem;
        font-weight: 600;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        font-family: 'Poppins', sans-serif;
    }

    .button.yes {
        background: linear-gradient(135deg, #ff9a9e, #fecfef);
        color: white;
    }

    .button.yes:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 40px rgba(255, 154, 158, 0.4);
    }

    .button.no {
        background: linear-gradient(135deg, #a8edea, #fed6e3);
        color: #555;
        transition: all 0.3s ease, transform 0.3s ease;
    }

    .button.no:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 40px rgba(168, 237, 234, 0.4);
    }

    .button.no.shrink {
        transform: scale(0.8);
    }

    .button.no.hide {
        display: none;
    }
</style>
</head>
<body>

<!-- SOBRE -->
<div class="envelope" id="envelope" onclick="openLetter()">
    <div class="flap"></div>
</div>

<!-- CARTA -->
<div class="card" id="card">
    <img id="img">
    <div class="text" id="text"></div>
    <div class="hint" id="hint">Toca para continuar 💕</div>
    <div class="buttons" id="buttons">
        <button class="button yes" onclick="sayYes()">Sí</button>
        <button class="button no" id="noButton" onclick="sayNo()">No</button>
    </div>
</div>

<script>
const slides = [
    { img: "https://i.imgur.com/uEilUM5.jpeg", text: "Desde que apareciste, todo empezó a sentirse diferente." },
    { img: "https://i.imgur.com/htGQLSR.jpeg", text: "Hay miradas que dicen más que mil palabras." },
    { img: "https://i.imgur.com/RHiGqvz.jpeg", text: "Momentos simples… pero contigo se vuelven eternos." },
    { img: "https://i.imgur.com/ger2EXZ.jpeg", text: "No sabía que alguien podía convertirse en hogar." },
    { img: "https://i.imgur.com/SNGHDVV.jpeg", text: "Y aun así, cada día me sorprendes más." },
    { img: "https://i.imgur.com/m3lQhuq.jpeg", text: "Gracias por existir. Esta historia apenas comienza 💖" }
];

slides.forEach(slide => {
    const preloadedImg = new Image();
    preloadedImg.src = slide.img;
});

let index = 0;
let started = false;
let noClicks = 0;

const img = document.getElementById("img");
const text = document.getElementById("text");
const hint = document.getElementById("hint");
const buttons = document.getElementById("buttons");
const noButton = document.getElementById("noButton");

function openLetter() {
    if (started) return;
    started = true;

    document.getElementById("envelope").classList.add("open");

    setTimeout(() => {
        document.getElementById("envelope").style.display = "none";
        document.getElementById("card").classList.add("show");
        showSlide(0);
    }, 1200);
}

function showSlide(i) {
    img.classList.add("hide");
    text.style.opacity = 0;
    text.style.transform = "translateY(20px)";

    setTimeout(() => {
        img.src = slides[i].img;
        text.innerText = slides[i].text;
        img.classList.remove("hide");
        text.style.opacity = 1;
        text.style.transform = "translateY(0px)";
    }, 600);
}

function next() {
    index++;
    if (index >= slides.length) {
        text.innerText = "¿ME AMAS? 😍";
        hint.style.display = "none";
        buttons.classList.add("show");
        return;
    }
    showSlide(index);
}

function sayYes() {
    text.innerText = "¡Sabía que dirías que sí! Te amo 😘";
    buttons.style.display = "none";
    hint.innerText = "Fin de la carta 💌";
    hint.style.display = "block";
}

function sayNo() {
    noClicks++;
    if (noClicks < 5) {
        noButton.classList.add("shrink");
        setTimeout(() => {
            noButton.classList.remove("shrink");
        }, 300);
    } else {
        noButton.classList.add("hide");
    }
}

// Cambiar el onclick del card para next solo si no están los botones
document.getElementById("card").onclick = function() {
    if (!buttons.classList.contains("show")) {
        next();
    }
};
</script>

</body>
</html>
